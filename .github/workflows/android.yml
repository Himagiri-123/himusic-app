name: Build Android app (APK)

# Run it: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
# or GitHub -> Actions -> "Build Android app" -> Run workflow.
# The APK appears under Releases as HiMusic.apk.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.1"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmdline-tools;latest build-tools;33.0.2'

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Build web app
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci
          npx vite build

      - name: Copy web app into Android project
        working-directory: client
        env:
          CAP_SERVER_URL: ${{ vars.APP_URL }}
        run: node scripts/cap-sync.mjs

      - name: Build APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersionName=${{ steps.v.outputs.name }} -PappVersionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../../HiMusic.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: HiMusic ${{ steps.v.outputs.name }}
          files: HiMusic.apk
