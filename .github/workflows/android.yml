name: Build Android app (APK)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
      API_URL: ${{ vars.API_URL }}
      CAP_SERVER_URL: ${{ vars.APP_URL }}
      VITE_API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmdline-tools;latest build-tools;33.0.2'

      - name: Build web app
        working-directory: client
        run: |
          npm ci
          npx vite build

      - name: Copy web app into Android project
        working-directory: client
        run: node scripts/cap-sync.mjs

      - name: Build APK (Debug Mode)
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PappVersionName="1.0.${{ github.run_number }}" -PappVersionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk ../../HiMusic.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "HiMusic 1.0.${{ github.run_number }}"
          files: HiMusic.apk
