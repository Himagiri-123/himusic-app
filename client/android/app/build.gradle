apply plugin: 'com.android.application'

def cSdk = (rootProject.ext.has("compileSdkVersion") && rootProject.ext.compileSdkVersion != null) ? rootProject.ext.compileSdkVersion : 34
def mSdk = (rootProject.ext.has("minSdkVersion") && rootProject.ext.minSdkVersion != null) ? rootProject.ext.minSdkVersion : 23
def tSdk = (rootProject.ext.has("targetSdkVersion") && rootProject.ext.targetSdkVersion != null) ? rootProject.ext.targetSdkVersion : 34

def vCodeProp = project.findProperty("appVersionCode")
def vCode = (vCodeProp != null && vCodeProp.toString().trim() != "") ? vCodeProp.toString().trim().toInteger() : 1

def vNameProp = project.findProperty("appVersionName")
def vName = (vNameProp != null && vNameProp.toString().trim() != "") ? vNameProp.toString().trim() : "1.0.0"

android {
    namespace "com.himusic.app"
    compileSdk cSdk
    defaultConfig {
        applicationId "com.himusic.app"
        minSdkVersion mSdk
        targetSdkVersion tSdk
        versionCode vCode
        versionName vName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        himusic {
            storeFile file("himusic.keystore")
            storePassword "himusic-app"
            keyAlias "himusic"
            keyPassword "himusic-app"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.himusic
        }
        release {
            signingConfig signingConfigs.himusic
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.media:media:1.7.0"
    // Native audio engine (plays music outside the WebView so Android can not suspend it)
    implementation "androidx.media3:media3-common:1.3.1"
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-datasource:1.3.1"
    implementation "androidx.media3:media3-database:1.3.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
